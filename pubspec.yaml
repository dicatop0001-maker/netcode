name: netcode
description: Plataforma de comunicacao local offline via QR Code e Mesh P2P
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^3.5.6
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.2
  nearby_connections: ^4.0.0
  image_picker: ^1.0.7
  flutter_image_compress: ^2.1.0
  uuid: ^4.3.3
  intl: ^0.19.0
  permission_handler: ^11.3.0
  share_plus: ^7.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.8

flutter:
  uses-material-design: true
