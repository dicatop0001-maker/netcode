name: Build Flutter APK

on:
  push:
    branches: [ main, principal ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --no-shrink

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: netcode-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'workflow_dispatch'
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Netcode v1.0.${{ github.run_number }}
          body: |
            ## Netcode APK - Build automatico

            ### Como instalar:
            1. Baixe o arquivo app-release.apk abaixo
            2. No Android ative Instalar de fontes desconhecidas nas configuracoes
            3. Abra o APK e instale

            ### Funcionalidades:
            - Chat local offline via Mesh P2P
            - QR Code para entrar em salas
            - Marketplace local
            - Nearby Connections API Bluetooth + Wi-Fi Direct
            - Retransmissao Mesh A B C D
          files: build/app/outputs/flutter-apk/app-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
